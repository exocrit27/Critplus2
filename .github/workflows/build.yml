
name: Build Critplus

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract Critplus
        run: unzip Critplus-0.1.0.zip -d .

      - name: Fix Loom repository settings
        run: |
          sed -i 's/RepositoriesMode.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' Critplus/settings.gradle.kts
          sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' Critplus/settings.gradle.kts

      - name: Build Critplus
        run: |
          chmod +x Critplus/gradlew
          cd Critplus
          ./gradlew build --no-daemon --stacktrace

      - name: Upload Critplus JAR
        uses: actions/upload-artifact@v4
        with:
          name: Critplus-JAR
          path: Critplus/build/libs/*.jar
          if-no-files-found: error
